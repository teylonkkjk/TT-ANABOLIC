<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Exclusão</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Roboto+Condensed:wght@400;700&display=swap');

        :root {
            --cor-fundo: #0a0a0a;
            --cor-card: #1a1a1a;
            --cor-borda: #B80C09; /* Vermelho intenso */
            --cor-texto-principal: #e0e0e0;
            --cor-texto-destaque: #ffffff;
            --cor-amarelo-aviso: #FFD700;
            --fonte-titulo: 'Teko', sans-serif;
            --fonte-corpo: 'Roboto Condensed', sans-serif;
        }

        body {
            background-color: var(--cor-fundo);
            color: var(--cor-texto-principal);
            font-family: var(--fonte-corpo);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .delete-container {
            background: var(--cor-card);
            border: 2px solid var(--cor-borda);
            border-radius: 5px;
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 25px rgba(184, 12, 9, 0.4);
        }

        .delete-container h1 {
            font-family: var(--fonte-titulo);
            color: var(--cor-borda);
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 1.5rem;
            line-height: 1;
        }

        .delete-container p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .delete-container strong {
            color: var(--cor-amarelo-aviso);
            font-weight: 700;
        }

        .warning-text {
            color: var(--cor-borda);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 1.1rem;
            margin-top: 1.5rem;
            margin-bottom: 2rem;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: inline-block;
            padding: 15px 20px;
            font-family: var(--fonte-titulo);
            font-size: 1.8rem;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
            border: none;
            letter-spacing: 1px;
        }

        .btn-confirm {
            background: var(--cor-borda);
            color: var(--cor-texto-destaque);
        }

        .btn-confirm:hover {
            background: #800806; /* Vermelho mais escuro */
            box-shadow: 0 0 15px rgba(184, 12, 9, 0.7);
            transform: translateY(-2px);
        }

        .btn-cancel {
            background: transparent;
            color: var(--cor-texto-principal);
            border: 2px solid #444;
        }

        .btn-cancel:hover {
            background: #444;
            color: var(--cor-texto-destaque);
        }

    </style>
</head>
<body>

    <div class="delete-container">
        <h1>Exclusão Permanente</h1>

        <p>Você tem certeza que deseja remover o produto <strong>"{{ produto.nome }}"</strong> do seu inventário?</p>
        
        <p class="warning-text">Esta ação não pode ser desfeita.</p>

        <form method="post" class="action-buttons">
            {% csrf_token %}
            <button type="submit" class="btn btn-confirm">Sim, remover</button>
            <a href="{% url 'home' %}" class="btn btn-cancel">Cancelar</a>
        </form>
    </div>

</body>
</html>
